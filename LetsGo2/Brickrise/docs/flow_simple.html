<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브릭라이즈 이용 흐름 (요약)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5fa; --surface:#ffffff; --ink:#1c2230; --ink-2:#4a5368; --ink-3:#7a8296; --line:#c9d0de;
  --cust:#2f6fd6; --cust-bg:#e7f0ff;
  --site:#7350c9; --site-bg:#f0eafd;
  --nav:#03a14a; --nav-bg:#e5f6ea;
  --ops:#d27a12; --ops-bg:#fff1df;
  --dec:#b8901a; --dec-bg:#fff8dc;
  --retry:#c23b2f; --retry-bg:#fdecea;
  --stud: rgba(38,50,74,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#12151c; --surface:#1b1f29; --ink:#e8ebf2; --ink-2:#b4bbcb; --ink-3:#8790a4; --line:#3a4152;
    --cust:#6ea2ff; --cust-bg:#1a2a45;
    --site:#a88bf0; --site-bg:#271f3d;
    --nav:#3ccf7a; --nav-bg:#16301f;
    --ops:#f0a34a; --ops-bg:#36260f;
    --dec:#e3bd4c; --dec-bg:#332a10;
    --retry:#ff7b6e; --retry-bg:#3a1a17;
    --stud: rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#12151c; --surface:#1b1f29; --ink:#e8ebf2; --ink-2:#b4bbcb; --ink-3:#8790a4; --line:#3a4152;
  --cust:#6ea2ff; --cust-bg:#1a2a45;
  --site:#a88bf0; --site-bg:#271f3d;
  --nav:#3ccf7a; --nav-bg:#16301f;
  --ops:#f0a34a; --ops-bg:#36260f;
  --dec:#e3bd4c; --dec-bg:#332a10;
  --retry:#ff7b6e; --retry-bg:#3a1a17;
  --stud: rgba(255,255,255,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;
  background-image:radial-gradient(var(--stud) 2.2px, transparent 2.6px);background-size:16px 16px}
main{max-width:820px;margin:0 auto;padding:36px 18px 56px}
h1{font-size:clamp(26px,4.2vw,38px);line-height:1.2;margin:0 0 8px}
.sub{color:var(--ink-2);margin:0 0 18px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;list-style:none;margin:0 0 18px;padding:0;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:16px;height:16px;border-radius:5px;border:2px solid}
.sw.cust{background:var(--cust-bg);border-color:var(--cust)}
.sw.site{background:var(--site-bg);border-color:var(--site)}
.sw.nav{background:var(--nav-bg);border-color:var(--nav)}
.sw.ops{background:var(--ops-bg);border-color:var(--ops)}
.sw.dec{background:var(--dec-bg);border-color:var(--dec);transform:rotate(45deg) scale(.8)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto;font-family:inherit}
.box{stroke-width:2.5}
.box.cust{fill:var(--cust-bg);stroke:var(--cust)}
.box.site{fill:var(--site-bg);stroke:var(--site)}
.box.nav{fill:var(--nav-bg);stroke:var(--nav)}
.box.ops{fill:var(--ops-bg);stroke:var(--ops)}
.box.retry{fill:var(--retry-bg);stroke:var(--retry);stroke-dasharray:6 4}
.box.end{fill:var(--cust);stroke:var(--cust)}
.dec{fill:var(--dec-bg);stroke:var(--dec);stroke-width:2.5}
.t{fill:var(--ink);font-size:19px;font-weight:700;text-anchor:middle}
.t.big{fill:#fff;font-size:22px}
.s{fill:var(--ink-2);font-size:14.5px;text-anchor:middle}
.s.sm{font-size:13px}
.s.strong{fill:var(--retry);font-weight:700;font-size:15px}
.stage{fill:var(--ink-3);font-size:15px;font-weight:700}
.stline{stroke:var(--line);stroke-width:1.5}
.arr{stroke:var(--ink-3);stroke-width:2.2;fill:none}
.arr.dash{stroke:var(--retry);stroke-dasharray:6 5}
.ahp{fill:var(--ink-3)}
.albl{fill:var(--ink-2);font-size:14px;font-weight:700}
.more{margin-top:20px;font-size:15px;color:var(--ink-2)}
.more a{color:var(--cust);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>브릭라이즈 이용 흐름</h1>
  <p class="sub">고객이 상품을 처음 보고, 사진 한 장으로 나만의 블럭 키트를 받아 완성하기까지의 과정을 고객 입장에서 간단히 정리했습니다.</p>
  <ul class="legend" aria-label="범례">
    <li><span class="sw cust"></span>고객이 하는 일</li>
    <li><span class="sw site"></span>브릭라이즈 사이트</li>
    <li><span class="sw nav"></span>네이버</li>
    <li><span class="sw ops"></span>브릭라이즈가 보내는 것</li>
    <li><span class="sw dec"></span>확인</li>
  </ul>
  <div class="chart">
<svg viewBox="0 0 790 1838" role="img" aria-label="브릭라이즈 고객 이용 흐름도"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><text class="stage" x="20" y="44">알게 되기</text><line class="stline" x1="20" y1="56" x2="774" y2="56"/><rect class="box nav" x="140.0" y="74" width="340" height="70" rx="14"/><text class="t" x="310" y="104">네이버 스토어에서 상품 보기</text><text class="s" x="310" y="127">평면·입체 예시, 가격, 반품 제한 안내</text><line class="arr" x1="310" y1="144" x2="310" y2="176" marker-end="url(#ah)"/><rect class="box cust" x="140.0" y="180" width="340" height="70" rx="14"/><text class="t" x="310" y="210">‘내 브릭 만들기’ 누르기</text><text class="s" x="310" y="233">로그인 없이 브릭라이즈 사이트로</text><text class="stage" x="20" y="310">시안 만들기</text><line class="stline" x1="20" y1="322" x2="774" y2="322"/><line class="arr" x1="310" y1="250" x2="310" y2="336" marker-end="url(#ah)"/><rect class="box cust" x="140.0" y="340" width="340" height="70" rx="14"/><text class="t" x="310" y="370">평면/입체, 크기 고르기</text><text class="s" x="310" y="393">5 · 10 · 15cm</text><line class="arr" x1="310" y1="410" x2="310" y2="442" marker-end="url(#ah)"/><rect class="box cust" x="140.0" y="446" width="340" height="70" rx="14"/><text class="t" x="310" y="476">사진 동의 체크</text><text class="s" x="310" y="499">개인정보 · 사진 권리 · 만 14세 이상</text><line class="arr" x1="310" y1="516" x2="310" y2="548" marker-end="url(#ah)"/><rect class="box cust" x="140.0" y="552" width="340" height="70" rx="14"/><text class="t" x="310" y="582">사진 1장 올리기</text><text class="s" x="310" y="605">밝은 곳에서, 피사체를 크게</text><line class="arr" x1="310" y1="622" x2="310" y2="654" marker-end="url(#ah)"/><polygon class="dec" points="310,658 470.0,717.0 310,776 150.0,717.0"/><text class="t" x="310" y="713.0">쓸 수 있는 사진인가요?</text><text class="s sm" x="310" y="735.0">너무 어둡거나 흐리거나 작은 사진</text><rect class="box retry" x="548" y="687.0" width="196" height="60" rx="12"/><text class="s strong" x="646.0" y="722.0">다시 찍어 올리기</text><line class="arr" x1="470.0" y1="717.0" x2="544" y2="717.0" marker-end="url(#ah)"/><text class="albl" x="493.0" y="705.0">아니오</text><path class="arr dash" d="M744,717.0 L766,717.0 L766,587.0 L484.0,587.0" marker-end="url(#ah)"/><line class="arr" x1="310" y1="776" x2="310" y2="808" marker-end="url(#ah)"/><text class="albl" x="324.0" y="796.0">예</text><rect class="box site" x="140.0" y="812" width="340" height="70" rx="14"/><text class="t" x="310" y="842">AI 시안 확인</text><text class="s" x="310" y="865">배경 자동 제거 · 블럭 수 · 가격 (하루 3회 무료)</text><line class="arr" x1="310" y1="882" x2="310" y2="914" marker-end="url(#ah)"/><polygon class="dec" points="310,918 470.0,977.0 310,1036 150.0,977.0"/><text class="t" x="310" y="983.0">시안이 마음에 드나요?</text><rect class="box retry" x="548" y="947.0" width="196" height="60" rx="12"/><text class="s strong" x="646.0" y="982.0">사진·옵션 바꿔서 다시</text><line class="arr" x1="470.0" y1="977.0" x2="544" y2="977.0" marker-end="url(#ah)"/><text class="albl" x="493.0" y="965.0">아니오</text><path class="arr dash" d="M744,977.0 L766,977.0 L766,587.0 L484.0,587.0" marker-end="url(#ah)"/><text class="stage" x="20" y="1096">주문하기</text><line class="stline" x1="20" y1="1108" x2="774" y2="1108"/><line class="arr" x1="310" y1="1036" x2="310" y2="1122" marker-end="url(#ah)"/><text class="albl" x="324.0" y="1083.0">예</text><rect class="box site" x="140.0" y="1126" width="340" height="70" rx="14"/><text class="t" x="310" y="1156">주문 코드 받기</text><text class="s" x="310" y="1179">예: BR-3D10-K7Q2 (입체 10cm)</text><line class="arr" x1="310" y1="1196" x2="310" y2="1228" marker-end="url(#ah)"/><rect class="box nav" x="140.0" y="1232" width="340" height="70" rx="14"/><text class="t" x="310" y="1262">네이버에서 결제</text><text class="s" x="310" y="1285">같은 옵션 · 블럭 수량 · 코드 입력</text><line class="arr" x1="310" y1="1302" x2="310" y2="1334" marker-end="url(#ah)"/><polygon class="dec" points="310,1338 470.0,1397.0 310,1456 150.0,1397.0"/><text class="t" x="310" y="1393.0">코드와 옵션·수량이 맞나요?</text><text class="s sm" x="310" y="1415.0">브릭라이즈가 자동 확인</text><rect class="box retry" x="548" y="1367.0" width="196" height="60" rx="12"/><text class="s strong" x="646.0" y="1402.0">네이버 톡톡으로 안내</text><line class="arr" x1="470.0" y1="1397.0" x2="544" y2="1397.0" marker-end="url(#ah)"/><text class="albl" x="493.0" y="1385.0">아니오</text><path class="arr dash" d="M744,1397.0 L766,1397.0 L766,1267.0 L484.0,1267.0" marker-end="url(#ah)"/><text class="stage" x="20" y="1516">받고 조립하기</text><line class="stline" x1="20" y1="1528" x2="774" y2="1528"/><line class="arr" x1="310" y1="1456" x2="310" y2="1542" marker-end="url(#ah)"/><text class="albl" x="324.0" y="1503.0">예</text><rect class="box ops" x="140.0" y="1546" width="340" height="70" rx="14"/><text class="t" x="310" y="1576">키트 받기</text><text class="s" x="310" y="1599">색상별 블럭 + QR 안내지 1장</text><line class="arr" x1="310" y1="1616" x2="310" y2="1648" marker-end="url(#ah)"/><rect class="box cust" x="140.0" y="1652" width="340" height="70" rx="14"/><text class="t" x="310" y="1682">QR 찍고 PDF 설명서로 조립</text><text class="s" x="310" y="1705">모자라면 네이버 톡톡 문의</text><line class="arr" x1="310" y1="1722" x2="310" y2="1754" marker-end="url(#ah)"/><rect class="box end" x="200" y="1758" width="220" height="56" rx="28"/><text class="t big" x="310" y="1794">완성!</text></svg>
  </div>
  <p class="more">단계별 세부 규칙(동의 항목, 가격 계산, 결제 방식, QR·PDF 구성 등)은 <a href="https://claude.ai/artifact/TgAJxomWZfczThZXZyQEdi">상세 흐름도</a>에서 볼 수 있습니다.</p>
</main>
</body>
</html>
